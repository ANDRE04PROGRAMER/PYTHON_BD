import numpy as np
from sklearn.model_selection import train_test_split
from sklearn.tree import DecisionTreeClassifier
from sklearn.linear_model import LogisticRegression
from sklearn.metrics import accuracy_score

# 1. Crear el dataset en Python
X = np.array([[1], [2], [3], [5], [6], [7], [8], [9]]) # Visitas
y = np.array(['No', 'No', 'No', 'Sí', 'Sí', 'Sí', 'Sí', 'Sí']) # Compra

# 2. Separar los datos en entrenamiento y prueba
# Usamos un 75% para entrenar y 25% para probar. 
# random_state asegura que la división sea la misma cada vez que ejecutes el código.
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)

# 3. Entrenar un árbol de decisión y un modelo de regresión logística
modelo_arbol = DecisionTreeClassifier(random_state=42)
modelo_regresion = LogisticRegression(random_state=42)

modelo_arbol.fit(X_train, y_train)
modelo_regresion.fit(X_train, y_train)

# 4. Obtener las predicciones para los datos de prueba
pred_arbol = modelo_arbol.predict(X_test)
pred_regresion = modelo_regresion.predict(X_test)

# 5. Calcular el porcentaje de predicciones correctas (Exactitud / Accuracy)
precision_arbol = accuracy_score(y_test, pred_arbol)
precision_regresion = accuracy_score(y_test, pred_regresion)

# Mostrar resultados
print(f"Datos de prueba (Visitas): {X_test.flatten()}")
print(f"Valores reales:            {y_test}")
print("-" * 40)
print(f"Predicciones Árbol:        {pred_arbol}")
print(f"Predicciones Regresión:    {pred_regresion}")
print("-" * 40)
print(f"Precisión Árbol de Decisión: {precision_arbol * 100}%")
print(f"Precisión Regresión Logística: {precision_regresion * 100}%")


Comparación y Explicación (Actividad 6)

¿Cuál obtuvo mayor porcentaje de aciertos?
En este caso específico, ambos modelos empataron con un 100% de aciertos (o un empate en el número de errores si se diera un caso atípico por la división aleatoria, aunque es poco probable).

¿Por qué sucede esto y cómo funcionan los modelos en este caso?

1. Naturaleza de los datos: Los datos de este ejercicio son extremadamente simples y están perfectamente separados (linealmente separables). Hay un patrón clarísimo: si el cliente visita 1, 2 o 3 veces, no compra; si visita 5 veces o más, sí compra. No hay casos ambiguos (como un cliente que visite 4 veces).
2. El Árbol de Decisión: Este modelo aprenderá rápidamente una regla simple. Básicamente creará un corte (un nodo) que diga: "Si Visitas <= 3, entonces 'No'; si Visitas > 3, entonces 'Sí'". Con una regla tan perfecta, clasificará correctamente cualquier dato nuevo que le pongamos.
3. La Regresión Logística: Este modelo busca una "curva" matemática (función sigmoide) que separe las dos clases calculando probabilidades. Al estar los datos tan separados (del 3 al 5 hay un salto enorme), la curva se adaptará perfectamente en medio de esa brecha. Cualquier cliente con 1, 2 o 3 visitas tendrá una probabilidad muy baja de comprar, y con 5 o más, una probabilidad muy alta.

Conclusión práctica:
Con un dataset tan pequeño y "limpio", tanto un modelo basado en reglas (Árbol) como uno estadístico-lineal (Regresión) van a resolver el problema a la perfección. En un caso real, donde los datos son más ruidosos, desordenados y las fronteras no son tan claras, ahí es donde verías diferencias significativas: los árboles pueden captar relaciones más complejas, mientras que la regresión logística es más robusta contra el sobreajuste si la relación es simple.
