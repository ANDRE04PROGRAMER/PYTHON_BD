import numpy as np
from sklearn.linear_model import LinearRegression

# 1. Crear un programa con los datos proporcionados
# X (Variable independiente): Publicidad. Debe ser una matriz 2D.
X = np.array([[100], [200], [300], [400], [500], [600]])

# y (Variable dependiente): Productos vendidos.
y = np.array([20, 35, 50, 65, 80, 95])

# 2. Utilizar un modelo de regresión lineal
modelo = LinearRegression()

# 3. Entrenar el modelo utilizando los datos disponibles
modelo.fit(X, y)

# 4. Predecir cuántos productos se venderían si se invierte S/ 350
inversion_nueva = np.array([[350]])
prediccion = modelo.predict(inversion_nueva)

# Mostrar el resultado
print(f"Predicción de ventas para una inversión de S/ 350: {prediccion[0]} productos")


¿Qué significa este resultado?
El modelo de regresión lineal ha encontrado una relación matemática perfecta entre la inversión en publicidad y las ventas. Si observas los datos, por cada S/ 100 adicionales que invierte la tienda, las ventas aumentan exactamente en 15 productos.

La ecuación de la línea que el modelo encontró es:
Ventas = 0.15 * (Publicidad) + 5

Por lo tanto, al reemplazar la publicidad con 350, obtenemos:

· Ventas = 0.15 * 350 + 5 = 52.5 + 5 = 57.5

En términos de negocio:
Si la tienda decide invertir S/ 350 en publicidad este mes, puede esperar vender alrededor de 57 o 58 productos. Este es un punto intermedio lógico entre los datos históricos: cuando invirtieron S/ 300 vendieron 50, y cuando invirtieron S/ 400 vendieron 65. Al invertir S/ 350 (justo a la mitad), lo lógico es esperar vender la mitad de la diferencia, es decir, 57.5.


