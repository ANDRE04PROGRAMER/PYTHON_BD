import numpy as np
from sklearn.neighbors import KNeighborsClassifier

# 1. Registrar los datos en Python
# X: Característica (Compras mensuales). Debe ser una matriz 2D.
X = np.array([[50], [70], [90], [300], [350], [400]])

# y: Etiquetas (Categoría)
y = np.array(['Bajo', 'Bajo', 'Bajo', 'Alto', 'Alto', 'Alto'])

# 2. Entrenar un modelo KNN y 3. Configurar los tres vecinos más cercanos
# Creamos el modelo indicando n_neighbors=3
modelo_knn = KNeighborsClassifier(n_neighbors=3)

# Entrenamos el modelo con los datos
modelo_knn.fit(X, y)

# 4. Predecir la categoría de un cliente que gasta S/ 320
nuevo_cliente = np.array([[320]])
prediccion = modelo_knn.predict(nuevo_cliente)

# Mostrar el resultado
print(f"El nuevo cliente que gasta S/ 320 pertenece a la categoría: {prediccion[0]}")

Explicación de cómo KNN clasifica al nuevo cliente

El algoritmo KNN (K-Nearest Neighbors o K-Vecinos más Cercanos) es un método de clasificación basado en instancias. Para clasificar al nuevo cliente con un gasto de S/ 320, el algoritmo hace lo siguiente:

1. Calcula distancias: Mide la distancia (en este caso, la diferencia numérica) entre el nuevo dato (320) y todos los datos que ya conoce de la tabla.
   · Distancia a 50 (Bajo) = 270
   · Distancia a 70 (Bajo) = 250
   · Distancia a 90 (Bajo) = 230
   · Distancia a 300 (Alto) = 20
   · Distancia a 350 (Alto) = 30
   · Distancia a 400 (Alto) = 80
2. Selecciona los K vecinos más cercanos: Como configuramos el modelo con K=3, el algoritmo selecciona los 3 clientes con la menor distancia al nuevo cliente. En este caso, los 3 más cercanos son:
   · El cliente de 300 (Categoría Alto) a una distancia de 20.
   · El cliente de 350 (Categoría Alto) a una distancia de 30.
   · El cliente de 400 (Categoría Alto) a una distancia de 80.
3. Vota (Mayoría): El algoritmo mira las categorías de esos 3 vecinos más cercanos.
   · Vecino 1: Alto
   · Vecino 2: Alto
   · Vecino 3: Alto

Como la mayoría de sus 3 vecinos más cercanos (de hecho, todos) son de categoría "Alto", el algoritmo asigna la categoría "Alto" al nuevo cliente. En resumen, el modelo asume que un cliente nuevo se parecerá a los clientes que ya conoce y que tienen hábitos de consumo similares.

